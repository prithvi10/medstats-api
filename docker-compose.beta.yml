# Local beta stack — production-like, built from source, no GHCR required.
# Usage:
#   cp .env.beta.example .env.beta
#   ./scripts/beta_deploy.sh

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env.beta
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medstats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-medstats}
    volumes:
      - pgdata_beta:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medstats}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env.beta
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_beta:/app/uploads
      - charts_beta:/app/generated_charts
      - logs_beta:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build: .
    restart: unless-stopped
    env_file: .env.beta
    command: celery -A src.medstats.services.worker worker --loglevel=info --concurrency=2
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - uploads_beta:/app/uploads
      - charts_beta:/app/generated_charts
      - logs_beta:/app/logs

  ui:
    build:
      context: ../medstats-ui
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${BETA_HTTP_PORT:-3000}:80"
    volumes:
      - ./nginx.beta.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - ui

volumes:
  pgdata_beta:
  uploads_beta:
  charts_beta:
  logs_beta:
