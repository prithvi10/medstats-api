services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: medstats
      POSTGRES_PASSWORD: medstats
      POSTGRES_DB: medstats
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medstats"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://medstats:medstats@db:5432/medstats
      - DATABASE_URL_SYNC=postgresql://medstats:medstats@db:5432/medstats
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - JWT_SECRET=docker-dev-secret-key
      - ENV=development
      - DEBUG=true
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./uploads:/app/uploads
      - ./generated_charts:/app/generated_charts
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://medstats:medstats@db:5432/medstats
      - DATABASE_URL_SYNC=postgresql://medstats:medstats@db:5432/medstats
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENV=development
      - UPLOAD_DIR=/app/uploads
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./generated_charts:/app/generated_charts
    command: celery -A src.medstats.services.worker worker --loglevel=info --concurrency=2

  ui:
    build:
      context: ../medstats-ui
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - VITE_PROXY_TARGET=http://api:8000
    volumes:
      - ../medstats-ui/src:/app/src
      - ../medstats-ui/index.html:/app/index.html
      - ../medstats-ui/vite.config.ts:/app/vite.config.ts
      - ../medstats-ui/tailwind.config.js:/app/tailwind.config.js
      - ../medstats-ui/postcss.config.js:/app/postcss.config.js
      - ui_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  test:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://medstats:medstats@db:5432/medstats_test
      - DATABASE_URL_SYNC=postgresql://medstats:medstats@db:5432/medstats_test
      - REDIS_URL=redis://redis:6379/1
      - JWT_SECRET=test-secret-key
      - ENV=test
      - DEBUG=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
    command: >
      bash -c "
        PGPASSWORD=medstats psql -h db -U medstats -c 'CREATE DATABASE medstats_test;' 2>/dev/null || true
        python -m pytest tests/ -v --tb=short
      "
    profiles:
      - test

volumes:
  pgdata:
  ui_node_modules:
