[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (may need DB/files)
    rag: Live RAG retrieval against Postgres corpus
filterwarnings =
    ignore::RuntimeWarning:.*coroutine.*was never awaited.*
    ignore:The palette list has more values:UserWarning
    ignore::DeprecationWarning:pydantic.*
    ignore:Support for class-based.*config.*:DeprecationWarning
    ignore:invalid value encountered in scalar divide:RuntimeWarning
