name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Check imports compile
        run: python -c "import src.main"
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          DATABASE_URL_SYNC: "sqlite:///:memory:"
          JWT_SECRET: ci-secret
          ENV: test

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Unit tests only — no Postgres/Redis/OpenAI needed
      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short -m "not integration and not rag"
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          DATABASE_URL_SYNC: "sqlite:///:memory:"
          JWT_SECRET: ci-secret
          ENV: test
          OPENAI_API_KEY: dummy-key-for-tests

  migration-check:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Enable pgvector extension
        run: psql postgresql://ci:ci@localhost:5432/ci_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Apply migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci_test"
          DATABASE_URL_SYNC: "postgresql://ci:ci@localhost:5432/ci_test"
          JWT_SECRET: ci-secret
          ENV: test

      - name: Check for model drift
        run: alembic check
        env:
          DATABASE_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci_test"
          DATABASE_URL_SYNC: "postgresql://ci:ci@localhost:5432/ci_test"
          JWT_SECRET: ci-secret
          ENV: test
